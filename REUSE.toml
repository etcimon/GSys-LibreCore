#     whole" under different terms.
#
# SPDX has no operator expressing "the whole is X while portions remain Y":
# AND means both apply to the whole, OR means licensee's choice. Stacking two
# bare SPDX-License-Identifier tags in one file is ambiguous and is rejected as
# E-TIERCONFLICT. Every file therefore carries exactly ONE tag:
