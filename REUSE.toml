version = 1
SPDX-PackageName = "GSys LibreCore"
SPDX-PackageSupplier = "Etienne Cimon <see .active-contributor>"
SPDX-PackageDownloadLocation = "https://github.com/GlobecSys/librecore"

# ------------------------------------------------------------------------------
# Machine-readable provenance for tier R "Case B" files.
#
# These are third-party files that Etienne Cimon has substantially modified (see
# the measured deltas in AGENTS-licensing.md). Each such file:
#
#   * RETAINS its original upstream copyright notice and its original
#     SPDX-License-Identifier verbatim, in place, untouched. Removing either
#     would breach Apache-2.0 s.4(c) / Solderpad s.4 and is E-UPSTREAMWRITE.
#
#   * is ADDITIONALLY offered, as a whole, by Etienne Cimon under
#     "CERN-OHL-S-2.0 OR LicenseRef-GSys-Commercial", per the permission in
#     Apache-2.0 s.4 final paragraph to license "any such Derivative Works as a
#     whole" under different terms.
#
# SPDX has no operator expressing "the whole is X while portions remain Y":
# AND means both apply to the whole, OR means licensee's choice. Stacking two
# bare SPDX-License-Identifier tags in one file is ambiguous and is rejected as
# E-TIERCONFLICT. Every file therefore carries exactly ONE tag:
#
#   * where the upstream notice already declares an SPDX identifier (the five
#     Thales config packages, SHL-2.0), that upstream tag is kept untouched and
#     the outbound offer is a prose "Outbound-License:" line;
#
#   * where the upstream notice is PROSE ONLY and declares no identifier (the
#     eight ETH Zurich / University of Bologna files with prose Solderpad
#     notices), there is nothing to displace, so the outbound offer IS the
#     file's single SPDX tag. The prose upstream notice above it is untouched.
#
# Either way the authoritative machine-readable statement lives here.
#
# Reading this table: "SPDX-License-Identifier" below is the OUTBOUND offer.
# The retained upstream licence is named in the comment on each block and in the
# file's own header.
# ------------------------------------------------------------------------------

# --- ETH Zurich / University of Bologna originals (retain SHL-0.51) -----------
