#     file's single SPDX tag. The prose upstream notice above it is untouched.
#
# Either way the authoritative machine-readable statement lives here.
#
# Reading this table: "SPDX-License-Identifier" below is the OUTBOUND offer.
# The retained upstream licence is named in the comment on each block and in the
# file's own header.
# ------------------------------------------------------------------------------

