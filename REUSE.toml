# ------------------------------------------------------------------------------
# De minimis exclusions — recorded here so a scanner cannot silently "promote"
# them. These carry an Etienne Cimon modification that is too small to support
# relicensing the whole file. They are tier U. Do not change.
#   core/include/ariane_pkg.sv  +39/-7 in 806 lines (4.8%)
#   corev_apu/clint/clint.sv     +8/-1 in 264 lines
# ------------------------------------------------------------------------------
[[annotations]]
path = [
  "core/include/ariane_pkg.sv",
  "corev_apu/clint/clint.sv",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018 ETH Zurich and University of Bologna"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-0.51"
SPDX-FileComment = "TIER U BY DELIBERATE DECISION. Contains a small Etienne Cimon modification, below the de minimis threshold in .licensing-policy. NOT offered under CERN-OHL-S-2.0. See AGENTS-licensing.md."

