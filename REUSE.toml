  "corev_apu/src/ariane.sv",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2018 ETH Zurich and University of Bologna",
  "2026 Etienne Cimon",
]
SPDX-License-Identifier = "CERN-OHL-S-2.0 OR LicenseRef-GSys-Commercial"
SPDX-FileComment = "Upstream portions remain licensed Apache-2.0 WITH SHL-0.51 by ETH Zurich and University of Bologna; that grant is unaffected."

