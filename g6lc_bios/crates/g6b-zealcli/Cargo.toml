[package]
name = "g6b-zealcli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VGA mouse-less ZealOS-shaped CLI; HolyC builtins; no g6b-hw"

[dependencies]
g6b-spec = { workspace = true }
g6b-holyc = { workspace = true }
# Real block devices, partition tables and filesystems. The CLI walks them; it
# does not implement them.
g6b-vfs = { workspace = true }
g6b-bootctl = { workspace = true }

# Test-only: the guest decodes the same keycodes (`g6b_asm::cli::keycode_ascii`),
# and two keymaps that disagree is a bug an operator meets one key at a time.
# A dev-dependency pins them together without putting the IR in the CLI.
[dev-dependencies]
g6b-asm = { workspace = true }

[lints]
workspace = true
