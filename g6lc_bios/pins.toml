# pins.toml — crate and toolchain pins. No Go goja, no QEMU, no OpenSBI.

[package]
version = "0.1.0"
stage = "B20"
schema_version = "1"

[toolchain]
rust = "1.85.0"
python_min = "3.9"

[graphics_wire]
role = "external-protocol-reference-only"
virglrenderer_url = "https://gitlab.freedesktop.org/virgl/virglrenderer.git"
virglrenderer_version = "1.0.0"
virglrenderer_rev = "9c9d55ecbe502e0d71ee99529709efcca69aac42"
mesa_url = "https://gitlab.freedesktop.org/mesa/mesa.git"
mesa_version = "24.3.4"
mesa_rev = "769e51468b49b2a42f0a0eaf71cf9eed5ff4e5de"
linux_url = "https://github.com/torvalds/linux.git"
linux_version = "6.6"
linux_rev = "ffc253263a1375a65fa6c9f62a893e9767fbebfa"
virtio_spec = "https://docs.oasis-open.org/virtio/virtio/v1.3/virtio-v1.3.pdf"
capset_id = 1
capset_version = 1
capset_bytes = 308
note = "P0 reference pins, not build dependencies or a GLES capability grant; no external renderer is linked into BIOS or APU firmware."

# Semantic reference only. Never a crate or Go module dependency.
[js]
spec = "goja-es5.1"
spec_url = "https://github.com/dop251/goja"
rev = "f87b40ad7341524f081e8d08d9f295b18f6c41a6"
path = "kernel-spec/goja"
license = "MIT"
note = "opcodes and host-loop contract; not linked; not a Go module"

[dom]
spec = "lirx-js-dom"
spec_url = "https://github.com/lirx-js/dom"
rev = "deef354d89a362373774cfc6258b8b88986f4d72"
path = "kernel-spec/lirx-dom"
license = "MIT"
note = "DOM locality spec; not linked"

[webidl]
spec = "gecko-webidl"
path = "kernel-spec/webidl"
license = "MPL-2.0"
note = "copied definitions; not compiled; live/stub in g6b-webidl"

[svelte_d]
spec = "svelte-d"
spec_url = "https://github.com/etcimon/svelte-d"
rev = "45a7d1a818b6fe4aa62180a5abfa55d818597bb9"
path = "kernel-spec/svelte-d"
license = "MIT"
note = "Svelte→libwasm/WASM UI spec; not LDC; not Binaryen; not compiled here"

[libwasm]
spec = "libwasm-druntime"
path = "kernel-spec/libwasm"
license = "MIT"
note = "WASM JIT druntime / Object_Call / fetch spec; not compiled; not LDC"

[botan]
spec = "botan-d"
path = "kernel-spec/botan"
license = "BSD-2-Clause"
note = "TLS/X.509/RSA/ECDSA spec; not compiled; rewrite in g6b-tls"

[zealos]
role = "kernel-spec-reference"
url = "https://github.com/Zeal-Operating-System/ZealOS.git"
rev = "eee210f4379ba3d00b47507f336a158eefb2c993"
path = "kernel-spec/ZealOS"
license = "Unlicense"
note = "not a crate; not linked; refresh with kernel-spec/fetch.ps1"

[font]
name = "fontdue"
spec = "fontdue"
spec_url = "https://github.com/mooman219/fontdue"
rev = "0.8.0"
license = "MIT OR Apache-2.0 OR Zlib"
note = "external TTF parser/rasterizer; pinned per KD0; std-only no simd/parallel"

[templeos]
role = "kernel-spec-reference"
url = "https://github.com/cia-foundation/TempleOS.git"
rev = "c26482bb6ad3f80106d28504ec5db3c6a360732c"
path = "kernel-spec/TempleOS"
license = "public-domain"
note = "not a crate; not linked; original HolyC/Adam/Kernel snapshot"

# Electric SQL PGlite — build input, not kernel-spec (dist bytes will be served).
# Git submodule has sources only; `/packages/pglite/dist` is gitignored upstream.
# Dist wasm is the npm tarball pin (PR8 extracts). Not a Cargo member. Not compiled.
[pglite]
role = "build-input"
url = "https://github.com/etcimon/pglite.git"
rev = "ae182ff8bd5ba4acb887d6c925d607a1498aa0b5"
branch = "main"
path = "pglite"
license = "Apache-2.0"
note = "Fork of electric-sql/pglite origin/main. TS client Apache-2.0; Postgres wasm inside dist is PostgreSQL License (NOTICE). Never rewritten. Never a crate."

[pglite.dist]
package = "@electric-sql/pglite"
version = "0.5.8"
tarball = "https://registry.npmjs.org/@electric-sql/pglite/-/pglite-0.5.8.tgz"
sha256 = "d71088d246d86e946c5d53b152a23c6b79ee65c8bc43dab69670af53b57c788d"
integrity = "sha512-n9tsbUOhwx2epK1V0ZG9Ar4SHWUju04dhmzZXiSBXwBoleOvIfals33NAaWgagQVAL4Rbvx/Ptsu3P+pA09f6Q=="
files = ["pglite.wasm", "initdb.wasm", "pglite.data", "index.js"]
extract_to = ".tools/pglite-dist"
note = "git submodule cannot fetch dist. python tools/g6b.py pglite-dist extracts here (PR8). Never include_bytes a missing git dist/."
