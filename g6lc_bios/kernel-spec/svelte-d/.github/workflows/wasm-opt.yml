name: wasm-opt

# Compile the etcimon/binaryen (branch svelte-d) wasm-opt for
# linux / macos / windows. setup downloads those assets into
# binaryen-build/<triple>/ the same way it fetches LDC 1.43.

on:
  push:
    branches: [master]
    paths:
      - 'binaryen/**'
      - '.github/workflows/wasm-opt.yml'
      - 'scripts/package-wasm-opt.ts'
      - 'scripts/publish-wasm-opt-branch.ts'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wasm-opt.yml'
      - 'scripts/package-wasm-opt.ts'
      - 'scripts/publish-wasm-opt-branch.ts'

permissions:
  contents: write

jobs:
  build:
    name: wasm-opt ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: linux-x86_64
          - os: ubuntu-24.04-arm
            variant: linux-aarch64
          - os: macos-14
            variant: darwin-arm64
          - os: macos-14
            variant: darwin-x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: windows-latest
            variant: windows-x86_64
            cmake_extra: -A x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Binaryen submodule
        run: git submodule update --init --depth 1 binaryen

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: CMake
        uses: lukka/get-cmake@latest

      - name: Configure + build wasm-opt
        shell: bash
        run: |
          set -eux
          # Unbounded --parallel OOMs ubuntu-24.04-arm (SIGTERM) and evicts
          # ubuntu-latest mid-link. Binaryen CXX units are large; 2 jobs
          # fits the 7–16 GiB hosted runners. Keep BUILD_LLVM_DWARF (suffix
          # tree includes llvm/Support/Allocator.h even for wasm-opt).
          GEN=()
          if [ "${{ runner.os }}" != "Windows" ]; then
            GEN+=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          fi
          cmake -S binaryen -B binaryen-cmake \
            -DENABLE_WERROR=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            ${{ matrix.cmake_extra }} \
            "${GEN[@]}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build binaryen-cmake --target wasm-opt --config Release --parallel 2
          else
            cmake --build binaryen-cmake --target wasm-opt --parallel 2
          fi

      - name: Package
        shell: bash
        run: bun scripts/package-wasm-opt.ts ${{ matrix.variant }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wasm-opt-${{ matrix.variant }}
          path: |
            binaryen-build/dist/wasm-opt-${{ matrix.variant }}.tar.gz
            binaryen-build/${{ matrix.variant }}/
          if-no-files-found: error

  publish:
    name: Publish wasm-opt binaries
    needs: build
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
        continue-on-error: true

      - name: Flatten archives
        run: |
          mkdir -p release
          find dist -name 'wasm-opt-*.tar.gz' -exec cp {} release/ \;
          ls -la release
          test -n "$(ls -A release 2>/dev/null)" || { echo 'no archives'; exit 1; }

      - name: Push wasm-opt-binaries branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-wasm-opt-branch.ts release

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes='Prebuilt wasm-opt from etcimon/binaryen branch svelte-d (Flatten + Asyncify on try_table).
          bunx svelte-d setup downloads wasm-opt-<triple>.tar.gz from the wasm-opt-binaries branch, or from this release.
          Binaryen is Apache-2.0; each archive includes LICENSE.'
          if gh release view wasm-opt-svelte-d >/dev/null 2>&1; then
            gh release upload wasm-opt-svelte-d release/* --clobber
          else
            gh release create wasm-opt-svelte-d release/* \
              --title 'wasm-opt (etcimon/binaryen svelte-d)' \
              --notes "$notes"
          fi
