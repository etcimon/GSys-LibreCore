# LibreCore APU Venus device profile — under construction, not advertised.
# Values here seed APU_VN_PROFILE words consumed by reply programs (RCONST).
# Nothing in this file is asserted to a stock client until the lane qualifies.

# sType values emitted as APU_VN_STYPE_* for executor chain-policy
# matching even though the struct never reaches a generated table:
# VkImportMemoryFdInfoKHR carries a plain int fd and is unserializable
# on the Venus wire, so a client cannot send it — the constant exists so
# the documented refusal lives with the serializable import refusal.
named_stypes = ["VkImportMemoryFdInfoKHR"]

# 3d-b: non-bool chained property structs admitted to the dec/rep chain
# tables with all-zero reply bodies ("not implemented" — the device is
# Vulkan 1.1, so every 1.2+ rollup reports no capability).  All-VkBool32
# feature structs need no entry: they are admitted unconditionally and
# answer all-zero / FLAGS-validated by construction.
zero_bodies = [
    "VkPhysicalDeviceVulkan11Properties",
    "VkPhysicalDeviceVulkan12Properties",
    "VkPhysicalDeviceVulkan13Properties",
    "VkPhysicalDeviceVulkan14Properties",
    # VkPhysicalDeviceDriverProperties: all-zero is the truthful renderer
    # answer — no renderer-side driver identity is claimed (unqualified
    # device).  Mesa overrides driverName="venus"/driverID=MESA_VENUS and
    # hashes driverUUID from its own strings at sanitize time, so the
    # wire body is never seen by the application.
    "VkPhysicalDeviceDriverProperties",
]

[device]
apiVersion = "1.1.0"
driverVersion = 0
vendorID = 0
deviceID = 0
deviceType = "OTHER"          # VK_PHYSICAL_DEVICE_TYPE_OTHER
deviceName = "LibreCore APU (unqualified)"

[features]
# VkPhysicalDeviceFeatures members set true; everything else stays 0.
fragmentStoresAndAtomics = true
robustBufferAccess = true
shaderStorageImageWriteWithoutFormat = false

[limits]
# VkPhysicalDeviceLimits members set non-zero; everything else stays 0.
maxBoundDescriptorSets = 4
maxImageDimension2D = 4096
maxPushConstantsSize = 128
maxComputeWorkGroupSize = [64, 64, 64]
maxComputeWorkGroupInvocations = 64
maxComputeSharedMemorySize = 16384
minUniformBufferOffsetAlignment = 256
minStorageBufferOffsetAlignment = 256
nonCoherentAtomSize = 64
maxViewports = 1
maxColorAttachments = 4
maxFramebufferWidth = 4096
maxFramebufferHeight = 4096
maxVertexInputAttributes = 16
maxVertexInputBindings = 16

[memory]
# VkPhysicalDeviceMemoryProperties: heap 0 DEVICE_LOCAL, two types on heap 0.
heap0_size = 0x10000000
type0_flags = "DEVICE_LOCAL"
type1_flags = "HOST_VISIBLE|HOST_COHERENT"

[queue_family0]
queueFlags = "GRAPHICS|COMPUTE|TRANSFER"
queueCount = 1
timestampValidBits = 64
minImageTransferGranularity = [1, 1, 1]

[formats]
# name = optimalTiling feature names (linear/buffer mirror unless overridden).
# Color formats get SAMPLED|COLOR_ATTACHMENT|BLIT_SRC|BLIT_DST|TRANSFER_SRC|TRANSFER_DST;
# depth formats get SAMPLED|DEPTH_STENCIL_ATTACHMENT|TRANSFER_SRC|TRANSFER_DST.
color = ["R8G8B8A8_UNORM", "B8G8R8A8_UNORM", "R16G16B16A16_SFLOAT", "R32_SFLOAT", "R32G32B32A32_SFLOAT"]
depth = ["D32_SFLOAT", "D24_UNORM_S8_UINT"]

[device_extensions]
# vkEnumerateDeviceExtensionProperties elements.  In the Venus model the
# renderer's KHR_external_memory_fd is how device memory becomes a
# guest-mappable blob (host alloc exported as an fd, mmap'd into the
# host-visible window).  LibreCore's aperture blob — RESOURCE_CREATE_BLOB
# (blob_id = memory id) mapping the memory's pages onto the SHM window —
# is that mechanism natively; no fd ever crosses the wire
# (vkGetMemoryFdKHR / vkGetMemoryFdPropertiesKHR are guest-side Mesa
# calls, vn_renderer_bo_export_dma_buf is a kernel ioctl).  This is a
# truthful capability statement, not a vacuous name.
"VK_KHR_external_memory_fd" = 1
# KHR_driver_properties (promoted to Vulkan 1.2): the device answers the
# query — VkPhysicalDeviceDriverProperties rides the props2 chain with
# the zero_bodies entry above — so the capability statement is truthful;
# Mesa sanitizes the real values (driverName "venus", driverID
# VK_DRIVER_ID_MESA_VENUS) over the wire body before the app sees them.
"VK_KHR_driver_properties" = 1

[subgroup]
# VkPhysicalDeviceSubgroupProperties — ShaderLanes = 8 SIMT lanes.
subgroupSize = 8
supportedStages = "COMPUTE"
supportedOperations = "BASIC"
quadOperationsInAllStages = false

[maintenance3]
# VkPhysicalDeviceMaintenance3Properties — allocation bound is the SHM
# aperture (APU_SHM_BYTES = 32 MiB); descriptor sets cap at 4096 per set.
maxPerSetDescriptors = 4096
maxMemoryAllocationSize = 0x2000000

[image_format_props]
# VkImageFormatProperties body for a supported 2D image.
maxMipLevels = 13
maxArrayLayers = 1
maxResourceSize = 0x2000000
sampleCounts = 1

[cap."vkAllocateMemory"]
# Chained pNext members captured into the op record's imm[] for the
# front-end executor's allocation policy (handleTypes must subset
# OPAQUE_FD, allocate-flags must be 0).
fields = ["VkExportMemoryAllocateInfo.handleTypes",
          "VkMemoryAllocateFlagsInfo.flags"]

[flag_masks]
# FLAGS decode rejects any bit outside these masks (per field type).
# "ALL" = every spec-defined enum bit — protocol-validity only; semantic
# support is the executor's decision (e.g. APU_VN_FMT_USAGE for image
# format properties), so format/usage probes may ask any combination.
VkBufferUsageFlags = "ALL"
VkImageUsageFlags = "ALL"

[capset_venus]
# struct virgl_renderer_capset_venus (Mesa 26.0.8 src/virtio/virtio-gpu/
# venus_hw.h): 10 u32 + vk_extension_mask1[32] = 40 words / 160 bytes.
# Emitted as APU_VN_CAPSET_WORDS / APU_VN_CAPSET[] in the package.
wire_format_version = 1
supports_blob_id_0 = 1
allow_vk_wait_syncs = 1
supports_multiple_timelines = 1
use_guest_vram = 0
# vk_extension_mask1[0] bit0 = "mask valid"; no renderer extensions claimed.
vk_extension_mask1_bit0_valid = 1

[bounds]
# ARRAY op faults above these counts. Keyed by the array's element struct name;
# 'default' covers everything else. Blob bounds are in bytes keyed by field.
VkSubmitInfo = 4            # submits <= 4
VkCommandStreamDescriptionMESA = 8   # streams per ExecuteCommandStreams
VkCommandStreamDependencyMESA = 8    # dependencies per ExecuteCommandStreams
size_t = 8                  # pReplyPositions
VkCommandBuffer = 16        # command buffers per submit <= 16
VkWriteDescriptorSet = 64   # descriptor writes <= 64 per call
VkDescriptorSetLayoutBinding = 64
VkAttachmentDescription = 8
VkAttachmentDescription2 = 8
VkAttachmentReference = 8
VkAttachmentReference2 = 8
VkSubpassDescription = 8
VkSubpassDescription2 = 8
VkClearAttachment = 8
VkVertexInputBindingDescription = 16
VkVertexInputAttributeDescription = 16
VkMappedMemoryRange = 16    # memory ranges <= 16
VkFence = 16                # fences <= 16
VkDescriptorImageInfo = 64
VkDescriptorBufferInfo = 64
VkBufferView = 64
VkDescriptorPoolSize = 64
VkBufferCopy = 1024
VkImageCopy = 256
VkBufferImageCopy = 256
VkImageBlit = 256
VkImageResolve = 256
VkClearRect = 256
VkViewport = 16
VkRect2D = 16
VkSpecializationMapEntry = 1024
VkGraphicsPipelineCreateInfo = 8
VkComputePipelineCreateInfo = 8
VkPipelineShaderStageCreateInfo = 8
VkSubpassDependency = 64
VkSubpassDependency2 = 64
VkDescriptorSetLayout = 64
VkDescriptorSet = 64
VkBuffer = 16               # vkCmdBindVertexBuffers pBuffers
VkDeviceSize = 16           # pOffsets pairs with pBuffers
VkDescriptorPoolSizeGroup = 64
uint32_t = 64               # generic u32 arrays (queue indices, offsets)
default = 256

[blob_bounds]
# BLOB op byte-count ceilings keyed by member name; 'default' otherwise.
pCode = 262144              # 65536 words of SPIR-V
pData = 1048576             # vkCmdUpdateBuffer / query results staging
pValues = 128               # vkCmdPushConstants <= maxPushConstantsSize
pInitialData = 1048576      # pipeline cache data
default = 1048576

# ---------------------------------------------------------------------------
# §7b payload keep-lists.  fields = dotted member paths; struct-array and
# plain-struct members enter the path, pointer hops are transparent (so
# 'pBindings.binding' names a member of *pCreateInfo).  Each listed field
# marks its U32/U64/HANDLE/BLOB/PTR op with KEEP (ROM a[7]): the decoder
# streams the words on the payload port in decode order.  See the
# "Payload layouts" section of g6lc_apu_vn_tables.md.

[keep.vkCreateDescriptorSetLayout]
# object payload: {bindingCount, per binding {binding, type, count, flags}}
# (bindingCount rides the op record; the front prepends it on objpay write)
fields = ["pBindings.binding", "pBindings.descriptorType",
          "pBindings.descriptorCount", "pBindings.stageFlags"]

[keep.vkCreatePipelineLayout]
# {setLayout handles (2w each), per push range {stageFlags, offset, size}}
fields = ["pSetLayouts", "pPushConstantRanges.stageFlags",
          "pPushConstantRanges.offset", "pPushConstantRanges.size"]

[keep.vkCreateComputePipelines]
# per element {module id (2w), pSpecializationInfo presence (1w),
#              layout id (2w)}
fields = ["pCreateInfos.layout", "pCreateInfos.stage.module",
          "pCreateInfos.stage.pSpecializationInfo"]

[keep.vkAllocateDescriptorSets]
# {set layout ids (2w each)}
fields = ["pSetLayouts"]

[keep.vkUpdateDescriptorSets]
# per write {dstSet (2w), dstBinding, dstArrayElement, descriptorCount,
#            descriptorType, per pBufferInfo {buffer (2w), offset (2w),
#            range (2w)}}
fields = ["pDescriptorWrites.dstSet", "pDescriptorWrites.dstBinding",
          "pDescriptorWrites.dstArrayElement",
          "pDescriptorWrites.descriptorCount",
          "pDescriptorWrites.descriptorType",
          "pDescriptorWrites.pBufferInfo.buffer",
          "pDescriptorWrites.pBufferInfo.offset",
          "pDescriptorWrites.pBufferInfo.range"]

[keep.vkCmdBindDescriptorSets]
# {descriptor-set ids (2w each), dynamic offsets}; the record stores the
# resolved handles instead of the ids
fields = ["pDescriptorSets", "pDynamicOffsets"]

[keep.vkCmdPushConstants]
# {offset, size, value words}
fields = ["offset", "size", "pValues"]

# §12.3 C/5a: Xfer operand payloads — the record's imm[] cannot carry
# the U64 operands, so they (and UpdateBuffer's data) stage into the
# cmdrec arena; imm[7] = arena base.
[keep.vkCmdCopyBuffer]
# per pRegions element {srcOffset (2w), dstOffset (2w), size (2w)};
# regionCount stays in rec.imm[0]
fields = ["pRegions.srcOffset", "pRegions.dstOffset", "pRegions.size"]

[keep.vkCmdFillBuffer]
# {dstOffset (2w), size (2w)}; the fill pattern stays in rec.imm[0]
fields = ["dstOffset", "size"]

[keep.vkCmdUpdateBuffer]
# {dstOffset (2w), dataSize (2w), pData words}
fields = ["dstOffset", "dataSize", "pData"]

# 3d-b: the *Memory2 bind commands carry their resource/memory handles
# inside the pBindInfos array elements — per-element handles cannot fit
# the fixed q-slots (the generator maps both to slot 7 and the memory
# wins).  Keep {resource, memory, memoryOffset} per element so vnfront
# can walk the staged triples and LOOKUP/SETBIND each itself;
# bindInfoCount stays in imm[0].
[keep.vkBindBufferMemory2]
# per pBindInfos element {buffer (2w), memory (2w), memoryOffset (2w)}
fields = ["pBindInfos.buffer", "pBindInfos.memory",
          "pBindInfos.memoryOffset"]

[keep.vkBindImageMemory2]
# per pBindInfos element {image (2w), memory (2w), memoryOffset (2w)}
fields = ["pBindInfos.image", "pBindInfos.memory",
          "pBindInfos.memoryOffset"]
