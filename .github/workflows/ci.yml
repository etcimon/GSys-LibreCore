#
# ci — fast, broad gates for GSys LibreCore, driven through the build platform.
#
# Every job is meant to finish in minutes on a stock ubuntu-latest runner. Each
# job provisions only what its lane needs (a handful of submodules, one Rust
# toolchain, the pinned Verilator) and then runs the *package's own* green gate
# through `./build.sh` (build-platform CLI) wherever a surface exists:
#
#   platform   build-platform typecheck + unit tests + offline CLI/timings lab (ubuntu, windows)
#   rtl-lint   Verilator v5.008 --lint-only of the core / SMT2 / OoO / SI packages (`diag run`)
#   sv-timing  sv-timing cargo tests + `test sv-timing-smoke` (timings compile of a fixture)
#   bios       g6lc_bios `g6b check --rust-only` (spec-sync, independence, fmt, clippy, cargo test, bios-regress)
#   qemu       g6lc_qemu `g6q check` (independence, fmt, clippy, cargo test)
#   ai-tensor  ai-tensor `tensor doctor` + `tensor test` + python unit tests
#   apu        `test apu-ci --coverage <level>` (Venus model + RTL unit cohort)
#   storamic   `test storamic-ci --coverage <level>` (unittests + protocol benches)
#   smoke      (workflow_dispatch only) heavy Verilator+Spike open-source smoke suites
#
# The heavy OpenHW regressions stay in openhw-cva6-ci-tier{1,2}.yml (dispatch).
# Docs are built/deployed by deploy-docs.yml.
#
# Checkout is deliberately `submodules: false`: two nested pointers
# (g6lc_bios/libwasm, g6lc_bios/svelte-d) are not published, so a recursive
# checkout fails. Jobs init exactly the submodules they need.

name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      smoke:
        description: "Also run the heavy open-source Verilator+Spike smoke suites"
        type: boolean
        default: false
      coverage:
        description: "apu / storamic coverage level (push and PR runs use standard)"
        type: choice
        options: [quick, standard, full]
        default: standard

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_COLOR: "1"
  # Never wait on the interactive "install missing managed tools?" prompt.
  G6LC_NO_TOOL_PROMPT: "1"
  # Rust lanes: no debuginfo / incremental — CI compiles once, tests once.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.85.0"

jobs:
  # ---------------------------------------------------------------------------
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Remote verify planning (qualification.test.ts) walks core/Flist.cva6.
      - name: Submodules for core/Flist.cva6
        run: git submodule update --init --recursive --depth 1 core/cvfpu core/cache_subsystem/hpdcache

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # devDependencies only (type packages); the runtime has zero dependencies
      # and bun.lock is intentionally untracked here.
      - name: Install dev dependencies
        working-directory: build-platform
        run: bun install

      - name: Typecheck
        working-directory: build-platform
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: build-platform
        run: bun test

      # The bootstrap wrappers and the offline CLI surface. None of these touch
      # the network or need EDA tools.
      - name: Platform CLI (Linux)
        if: runner.os != 'Windows'
        run: |
          ./build.sh config
          ./build.sh status
          ./build.sh test --list
          ./build.sh test --open-source --dry-run
          ./build.sh diag list
          ./build.sh diag run host
          ./build.sh timings doctor
          ./build.sh timings lab-run

      - name: Platform CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 config
          .\build.ps1 status
          .\build.ps1 test --list
          .\build.ps1 test --open-source --dry-run
          .\build.ps1 diag list
          .\build.ps1 timings doctor
          .\build.ps1 timings lab-run

      - name: Timings lab-run artifacts
        shell: bash
        run: |
          lab=build-platform/workspace/build/sta-handoff/lab-run
          for f in lab-report.md lab-report.json seeds.sdc opensta/paths.rpt correlate.json retune-proposal.md retune-proposal.json; do
            test -f "$lab/$f" || { echo "missing $lab/$f"; exit 1; }
          done
          # Offline S3a: fixture inject must yield a numeric overlap_score (not null)
          grep -Eq '"overlap_score"[[:space:]]*:[[:space:]]*[0-9]' "$lab/correlate.json"
          grep -q 'cva6-fo4-retune-proposal' "$lab/retune-proposal.json"
          head -n 40 "$lab/lab-report.md"

      - name: Doctor (informational)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: ./build.sh doctor

  # ---------------------------------------------------------------------------
  rtl-lint:
    name: rtl-lint (Verilator v5.008)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Submodules for core/Flist.cva6
        run: git submodule update --init --recursive --depth 1 core/cvfpu core/cache_subsystem/hpdcache

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned v5.008 + verif/regress/verilator-*.patch, cached; shared with
      # the apu / storamic lanes (.github/actions/pinned-verilator).
      - uses: ./.github/actions/pinned-verilator

      - name: Diagnostics status
        run: ./build.sh diag status

      # core = ISA red lines + firmware-accommodation scan + cv64a6_imafdc_sv39 /
      # cv32a65x lint + formal-package presence. The named ids add the LibreCore
      # packages (SMT2, integer OoO, two-core OoO coherence + L3, SI island).
      - name: Diagnostics
        run: |
          ./build.sh diag run core \
            diag-smt2-lint diag-smt2-comb-loops \
            diag-ooo-int-lint diag-smt2-ooo-int-lint diag-ooo-int2-lint diag-ooo-int2-l3-lint diag-smt2-l3-lint \
            diag-ai-lint

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-lint-logs
          path: build-platform/workspace/build/diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  sv-timing:
    name: sv-timing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Vendored sv-parser
        run: git submodule update --init --depth 1 sv-timing/crates/sv-parser

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      # `svt.py` only ever drives its contained toolchain under sv-timing/.tools.
      # The venv symlinks the exact hosted Python patch release, so the key
      # carries it: a runner image upgrade must not restore a dangling venv.
      - name: Cache contained toolchain
        uses: actions/cache@v4
        with:
          path: sv-timing/.tools
          key: svt-tools-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('sv-timing/rust-toolchain.toml', 'sv-timing/requirements.txt') }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: sv-timing/target
          key: svt-target-${{ runner.os }}-${{ hashFiles('sv-timing/Cargo.lock', 'sv-timing/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            svt-target-${{ runner.os }}-${{ hashFiles('sv-timing/Cargo.lock', 'sv-timing/rust-toolchain.toml') }}-

      - name: svt setup
        working-directory: sv-timing
        run: python tools/svt.py setup

      - name: svt doctor
        working-directory: sv-timing
        run: python tools/svt.py doctor

      - name: Package tests (cargo test)
        working-directory: sv-timing
        run: python tools/svt.py test

      # Host adapter: build-platform `timings compile` of the fixture project
      # through the package CLI, then the smoke assertions on the package.
      - name: Host smoke (build-platform test sv-timing-smoke)
        run: |
          ./build.sh test sv-timing-smoke

      # Known-red package hygiene at the time of writing (rustfmt drift, KD0
      # symbol strings in test fixtures). Reported, not blocking, until fixed.
      - name: svt check (informational)
        continue-on-error: true
        working-directory: sv-timing
        run: python tools/svt.py check

  # ---------------------------------------------------------------------------
  bios:
    name: bios (g6lc_bios)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: git restore-mtime needs per-file commit times
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: g6lc_bios
          cache-workspace-crates: true

      # Cargo fingerprints unchanged crates by mtime; a fresh checkout defeats
      # the cache unless mtimes are restored from git history.
      - name: Restore source mtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-restore-mtime
          git restore-mtime

      # kernel-spec submodules + botan RFC 8448 vectors (g6b-tls build.rs).
      - name: spec-sync
        working-directory: g6lc_bios
        run: python tools/g6b.py spec-sync

      # The browser-ui bun lane needs the libwasm/svelte-d submodules and LDC;
      # the tracked browser-ui/out artifacts feed the cargo gates instead.
      - name: g6b check --rust-only
        run: |
          ./build.sh g6b check --rust-only

  # ---------------------------------------------------------------------------
  qemu:
    name: qemu (g6lc_qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: git restore-mtime needs per-file commit times
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: g6lc_qemu
          cache-workspace-crates: true

      - name: Restore source mtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-restore-mtime
          git restore-mtime

      - name: g6q doctor
        run: |
          ./build.sh g6q doctor

      - name: g6q check
        run: ./build.sh g6q check

  # ---------------------------------------------------------------------------
  ai-tensor:
    name: ai-tensor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: git restore-mtime needs per-file commit times
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python test deps
        run: python -m pip install --quiet pytest numpy

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-tensor
          cache-workspace-crates: true

      - name: Restore source mtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-restore-mtime
          git restore-mtime

      - name: tensor doctor
        run: |
          ./build.sh tensor doctor

      # cargo tests + golden-check + queue-soak via monorepo-soak/run-ai-tensor.sh
      - name: tensor test
        run: ./build.sh tensor test

      - name: Python unit tests
        working-directory: ai-tensor
        env:
          PYTHONPATH: python
        run: python -m pytest -q -p no:cacheprovider python/tests

  # ---------------------------------------------------------------------------
  # Coverage-aware subproject gates (build-platform suites apu-ci /
  # storamic-ci; G6LC_COVERAGE via `test --coverage`). quick is host-only;
  # standard adds Verilator lint + bounded RTL benches; full runs every
  # locally runnable bench. Logs land under workspace/build/<suite>/.
  apu:
    name: apu (${{ inputs.coverage || 'standard' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE: ${{ inputs.coverage || 'standard' }}
    steps:
      - uses: actions/checkout@v4

      # `update = none` in .gitmodules: explicit syncs pass --checkout.
      - name: Venus protocol spec (golden-model tables)
        run: |
          git submodule update --init --checkout --depth 1 specs/venus-protocol \
            || git submodule update --init --checkout specs/venus-protocol

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: python -m pip install --quiet Mako numpy

      - if: env.COVERAGE != 'quick'
        uses: ./.github/actions/pinned-verilator

      - name: test apu-ci
        run: ./build.sh test apu-ci --coverage "$COVERAGE" --strict

      - name: Upload apu-ci logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apu-ci-logs
          path: build-platform/workspace/build/apu-ci
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  storamic:
    name: storamic (${{ inputs.coverage || 'standard' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE: ${{ inputs.coverage || 'standard' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: env.COVERAGE != 'quick'
        uses: ./.github/actions/pinned-verilator

      - name: test storamic-ci
        run: ./build.sh test storamic-ci --coverage "$COVERAGE" --strict

      - name: Upload storamic-ci logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storamic-ci-logs
          path: |
            build-platform/workspace/build/storamic-ci/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  smoke:
    name: open-source smoke (heavy, on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.smoke
    needs: [platform, rtl-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Submodules for simulation
        run: git submodule update --init --recursive --depth 1 core/cvfpu core/cache_subsystem/hpdcache corev_apu/axi_mem_if corev_apu/register_interface corev_apu/riscv-dbg corev_apu/rv_plic corev_apu/tb/common_verification verif/core-v-verif

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache managed toolchain
        uses: actions/cache@v4
        with:
          path: |
            build-platform/workspace/tooling
            build-platform/workspace/.cache
          key: ${{ runner.os }}-g6lc-tooling-${{ hashFiles('verif/regress/install-verilator.sh', 'verif/regress/install-spike.sh', '.config.ts') }}

      - name: Provision open-source toolchain
        run: |
          ./build.sh setup --install --allow-system-install

      - name: Run open-source smoke suites
        env:
          CVA6_BUILD_RUN_HW: "1"
        run: ./build.sh test --group smoke
