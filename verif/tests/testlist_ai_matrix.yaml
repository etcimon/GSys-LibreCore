# SPDX-License-Identifier: MIT
# Xg6lcai directed tests. Soft-skip / soft-pass on non-AI packages.
# Package of record: g6lc64_ai

testlist:
  - test: ai_csr_aistatus_xs
    description: aicfg/aistatus CSR + mstatus.xs (AI-X)
    path: custom/ai/ai_csr_aistatus_xs.S
  - test: ai_setcfg_readback
    description: setcfg grant clamp + aicfg/getcfg match
    path: custom/ai/ai_setcfg_readback.S
  - test: ai_illegal_when_off
    description: ais==Off rejects AI issue (illegal-instruction)
    path: custom/ai/ai_illegal_when_off.S
  - test: ai_dot4_s8_smoke
    description: T0 ai.dot4.s8 numerical smoke
    path: custom/ai/ai_dot4_s8_smoke.S
  - test: ai_mma_s8_golden
    description: T1 2x2x2 s8 MMA tile RF + multi-cycle mma (acc via tc_sram)
    path: custom/ai/ai_mma_s8_golden.S
  - test: ai_requant_rhe_golden
    description: requant round-half-to-even + relu
    path: custom/ai/ai_requant_rhe_golden.S
  - test: ai_pmu_group4_smoke
    description: PMU group-4 AI op/T0/MMA events via mhpmcounter3-5
    path: custom/ai/ai_pmu_group4_smoke.S
  - test: ai_queue_doorbell
    description: T0 enq/poll/qfence + aiqctl enable stub
    path: custom/ai/ai_queue_doorbell.S
  - test: ai_aiperm_umode
    description: aiperm CSR + M-mode always-allowed issue gate
    path: custom/ai/ai_aiperm_umode.S
  - test: ai_island_mmio_smoke
    description: SoC MMIO island at 0x40000000 — cap, good doorbell, AI-3 reject
    path: custom/ai/ai_island_mmio_smoke.S
  - test: ai_enq_sideband_smoke
    description: MMIO-latched desc + ai.enq sideband + ai.poll completion
    path: custom/ai/ai_enq_sideband_smoke.S
  - test: ai_gemm_s8_smoke
    description: I1-lite sequential GEMM 2x2x2 int8 golden via island doorbell
    path: custom/ai/ai_gemm_s8_smoke.S
  - test: ai_gemm_s8_lda_smoke
    description: I1-lite GEMM with lda>k row padding golden
    path: custom/ai/ai_gemm_s8_lda_smoke.S
  - test: ai_gemm_dim_err_smoke
    description: I1-lite rejects m>AccTile (MaxDim) with ST_ERR
    path: custom/ai/ai_gemm_dim_err_smoke.S
  - test: ai_gemm_s8_4x4_smoke
    description: I1 multi-step PE GEMM 4x4x8 all-ones (C=8)
    path: custom/ai/ai_gemm_s8_4x4_smoke.S
  - test: ai_gemm_s8_8x8_smoke
    description: 8x8x8 all-ones GEMM (C=8)
    path: custom/ai/ai_gemm_s8_8x8_smoke.S
  - test: ai_gemm_s8_16x16_smoke
    description: 16x16x16 all-ones GEMM (C=16)
    path: custom/ai/ai_gemm_s8_16x16_smoke.S
  - test: ai_gemm_s8_32x32_smoke
    description: 32x32x32 all-ones GEMM (C=32)
    path: custom/ai/ai_gemm_s8_32x32_smoke.S
  - test: ai_gemm_s8_64x64_smoke
    description: 64x64x64 all-ones GEMM (C=64)
    path: custom/ai/ai_gemm_s8_64x64_smoke.S
  - test: ai_gemm_s8_128x128_smoke
    description: Full AccTile 128x128x128 all-ones GEMM (C=128 corners)
    path: custom/ai/ai_gemm_s8_128x128_smoke.S
  - test: ai_cap_bringup_smoke
    description: Capability window advertises I1-lite PeLanes=16 AccTile=128
    path: custom/ai/ai_cap_bringup_smoke.S
