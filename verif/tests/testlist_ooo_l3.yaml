    gcc_opts: "-DSTAGE=36 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "A younger load to a disjoint address does not wait for an older store whose address is late"

  - test: ooo_csr_no_flu_freeze
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=37 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "Two CSR accesses with independent ALU work between them read and write in order without freezing the ALU"

  - test: ooo_load_misaligned_trap
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=32 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "A misaligned load must raise LD_ADDR_MISALIGNED with the faulting address and leave the destination unwritten, not abort simulation"

  - test: ooo_load_misaligned_not_taken
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=33 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "The misaligned load is reached only on the taken path, so a wrong-path fetch of it must not produce an architectural trap"

  - test: ooo_load_misaligned_vm_cold_dtlb
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=38 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "A misaligned load under Sv39 (MPRV data translation) whose first touch misses the DTLB is aborted, walked, re-issued and still raises LD_ADDR_MISALIGNED exactly once with the destination unwritten (T27: the Linux unaligned-access probe after satp)"

  - test: ooo_subword_forward_fresh_store
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=39 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "Every byte/halfword/word of a freshly stored doubleword, and a word over a later byte store, reads back exactly without a fence (T27 OpenSBI sbi_memchr shape)"

  - test: ooo_raw_across_ret
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=40 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "A callee's 32-bit store through a pointer into the caller's frame is observed by the caller's reload after seven pops and a ret (T27 fdt_next_tag -> fdt_check_prop_offset_ shape)"

  - test: ooo_raw_two_stores_same_word
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
