    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=50 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "64 doubleword stores over 8 lines, each interleaved with three loads from another region (tag-port contention), read back without a fence: every word must be the stored value (T34 hunt; passes on both fixup depths — the Linux stale-value oopses need more than this shape)"

