    description: "Two in-flight stores to the same word, the older with late data and the younger in a callee, then the load: forwarding picks the youngest older store"

  - test: ooo_raw_after_mispredict_recovery
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=42 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "Stage41 with a late-resolving taken branch and a wrong-path store between the younger store and the load: the recovery must not lose the in-flight store's forwarding"

  - test: ooo_jal_straddles_fetch_window
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=43 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "A predicted-taken 4-byte jal at offset 6 of an 8-byte fetch window (half in each window) redirects fetch; the instruction after it runs once and the callee runs (T29 shape, sequential arrival)"

  - test: ooo_jal_straddles_after_ret
    iterations: 1
    <<: *common_test_config
    asm_tests: <path_var>/custom/ooo/ooo_mem_min.S
    gcc_opts: "-DSTAGE=44 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles ../tests/custom/common/syscalls.c ../tests/custom/common/crt.S -I../tests/custom/env -I../tests/custom/common"
    description: "The straddling jal is the target of a mispredicted ret (the leaf rewrote ra): the fetch that starts at the jal's own address completes it from the next window and still redirects"

  - test: ooo_jal_straddles_after_sfence_ret
    iterations: 1
