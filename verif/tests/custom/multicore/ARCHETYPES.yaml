#
# ARCHETYPES.yaml - archetype x layer registry for the directed minis in this
# directory.
#
# WHY THIS FILE EXISTS
#   architecture/AGENTS-g6lc-opensbi-dev-heuristics.md section 5, item M5
#   ("Battery classification"): the minis under verif/tests/custom/multicore
#   were not tagged by archetype, so the archetype x layer matrix had unknown
#   coverage. This registry is that tagging. The coverage matrix derived from
#   it lives in
#   architecture/multi-threading/soft-ladder/README.md, section
#   "Archetype x layer coverage (M5)".
#
# VOCABULARY - all of it is imported, none of it is invented here.
#   archetypes W1..W7   AGENTS-g6lc-opensbi-dev-heuristics.md section 2
#   witness loci        AGENTS-g6lc-opensbi-dev-heuristics.md section 1
#                       (the WITNESSES list) and
#                       multi-threading/AGENTS-smt2-opensbi-dev-logics.md
#                       section 2 (the R1..R12 table)
#   layers              multi-threading/AGENTS-smt2-opensbi-dev-logics.md
#                       section 2 "Home" column and section 4 owning_combo
#   invariants I1..I28  firmware-boot-principles.md section B
#
# WHAT A GREEN MINI PROVES - read before using this file to close anything.
#   Heuristic T4 / proposition P2: a mini that passes eliminates a SHAPE, never
#   a class. Each mini here fixes one point in a product of co-factors (second
#   hart, dual issue, RVC straddle, call nesting, live frame). Passing that
#   point says nothing about the other points of the same archetype. That is
#   why every entry carries both `cofactors` (what the mini supplies) and
#   `missing_cofactors` (what the firmware supplies and the mini does not).
#
# WHAT THIS FILE IS NOT
#   It is not a verdict record. It records EXISTENCE of a mini per cell, not
#   pass/fail. Per heuristic H3, every DI pass recorded before 2026-08-31 was
#   measured under a superseded verdict and must be re-run before it is cited.
#   It is also not a target: a `witness` field is a citation that the archetype
#   occurs in real supervisor firmware, never a specification and never
#   something RTL may know about.
#
# HONESTY RULES APPLIED HERE
#   * `null` means "not determinable from the source", and the `note` says so.
#   * `archetype: null` means no section-2 archetype fits; the mini is counted
#     as unclassified rather than forced into a cell, so the matrix is not
#     inflated. Seven minis are in that state.
#   * A `witness` is only filled in when the locus appears verbatim in the
#     heuristics WITNESSES list or the logics R-table. No locus is guessed.
#   * `mini_must_pass` / `mini_must_fail` are oracle controls (H3), not suite
#     members, and are listed under `controls` with no archetype.

meta:
  task: "M5 - Battery classification"
  source_dir: "verif/tests/custom/multicore"
  generated_from: "header comment blocks plus body inspection of every *.S in this directory"
  file_count: 115
  mini_count: 113
  control_count: 2

  archetypes:
    W1: "Structure walk - nested calls, pointer-through-argument stores, byte-assembled words, values that are offsets before they are addresses."
    W2: "Self-armed trap probe - arm vector, execute possibly-illegal, restore vector, inline, repeated."
    W3: "Indirect dispatch - function-pointer table, one indirect call per service."
    W4: "Byte-string walk - data-terminated loops over unaligned bytes; contract family identical to W1."
    W5: "Release/acquire handshake - one hart releases, others spin-acquire."
    W6: "Atomic ticket / reservation - amoadd ticket, lr/sc retry."
    W7: "Election / self-relocation - lottery, GOT rewrite, per-hart stack creation."

  layers:
    L1-align: "align_slots - bytes and alignment; I1-I5 (leftover, straddle, mixed RVC/RVI at every legal boundary)."
    L2-accept: "window_accept - whole-window acceptance; I7 (partial acceptance is illegal)."
    L3-order: "order - program order / packet; I6 (may drop, never modify)."
    L4-redirect: "arch_redirect - which PC is next; I8-I12 (priority, trap hold, eret, mispredict, sequential step)."
    LSU: "store queue / write buffer / D$ / forwarding; I16, I17. Explicitly NOT fetch."
    issue: "issue_read_operands and scoreboard hazards, including stall_csr_older."
    commit: "commit and squash membership; I13-I15."
    csr: "per-hart CSR banks and CLINT; I22, I25."
    amo: "amo_buffer / store_unit - AMO forward progress and reservation survival; I15, I24."
    thread-select: "SMT thread selection and the bounded fetch grant; I10, I23."
    none: "no layer under test - harness or bring-up smoke."

  cofactors:
    smt: "the mini is hart-aware: it reads mhartid and either parks mhartid!=0 or runs a live peer. The note says which; only five minis run a genuinely live peer."
    dual_issue: "the mini deliberately shapes an issue pair or names dual-issue as the mechanism under test, rather than merely being run on a DI package."
    rvc_straddle: "the mini deliberately places a 32-bit RVI so that it straddles a fetch window at a 2-byte boundary, or deliberately mixes RVC and RVI so RVI lands 2-byte aligned."
    nested_calls: "a call is made from inside a callee, so at least two frames are live at the pin."
    live_frame: "a callee-saved register, ra, or a stack slot must stay live across the event under test (a call, a trap, or a squash)."

  note: >-
    Counts derived from this file are counts of EXISTENCE, not of passing (H3).
    A mini that passes eliminates a shape, not a class (T4/P2), so
    `missing_cofactors` is as load-bearing as `cofactors`. Five minis run a live
    peer hart (mini_fetch_straddle, mini_fdt_ro_probe, mini_fdt_nt_osbi,
    mini_stq_press_smt, mini_ipi_hart1_sp); the other 59 minis that carry the
    `smt` flag only park mhartid!=0, which supplies a second hart context but no
    peer memory traffic. Where a layer assignment was contested the note records
    the co-owner rather than silently picking one.

