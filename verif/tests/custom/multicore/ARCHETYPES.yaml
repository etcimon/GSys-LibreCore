    note: "Hart0 writes CLINT MSIP[1] then WFI; hart1 is unseen until ipi_i[1], then runs _start, sets its own sp and writes tohost. Exactly the witness clause - a hart's stack does not exist until its own path writes it. One of only five minis with a live peer. csr/CLINT is a co-owner of the layer."

