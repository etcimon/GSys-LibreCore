# Pin for live I1/I3-lite island geometry. SoftIsland MMIO is package-local (M5);
# linux-uio is board path (feature linux-mmio / UIO). AccTile/Macs=256; NocWidth=64.
id = "island-p3-v1"
abi_rev = "0.1.0"
isa_doc_rev = "monorepo:architecture/ai-matrix/isa-encoding.md"
island_rev = "monorepo:ai-matrix-p1"
backend = "linux-uio"                 # Device.from_profile falls back to sim if no native/UIO
mmio_map = "island_p3_v1"
mmio_base = "0x40000000"
noc_width = 64
acc_tile_m = 256
acc_tile_n = 256
acc_tile_k = 256
macs_per_cycle = 256
plic_source = 8
wait_policy = "poll"          # poll | irq | dma — board may prefer irq with PLIC-8
submit_mode = "latch"         # latch | fetch — fetch uses desc_ptr + doorbell bit31
features = [
  "t2_desc_v1",
  "completion_word_v1",
  "ai3_regions",
  "op_gemm",
  "dma_fetch",
  "wr_cpl_en",
  "plic_src8",
  "pmu_v1",
  "acc_tile_256",
]
notes = "Bus micro-arch (trail C-store, multi-out AR) is RTL-only; software uses CAP/PMU."
