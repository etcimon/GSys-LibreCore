[package]
name = "mbcore_c"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C ABI for the mbgen live session. Unreal loads the cdylib; UBT does not build it. Editor builds: cargo rustc -p mbcore_c -- -C panic=abort."

[lib]
crate-type = ["cdylib", "rlib"]
name = "mbcore_c"

[dependencies]
mbcore = { path = "../mbcore" }
serde = "1"
serde_json = "1"
