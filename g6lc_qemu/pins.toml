#
# pins.toml — pinned external revisions and consumed contracts.
#
# Rule (AGENTS.md §1.9): external contracts are consumed BY PIN, never reinterpreted.
# When an upstream contract changes, bump the pin here AND the affected schema / ABI
# version in the same pass. Silently reinterpreting bits is the failure this file exists
# to prevent.

[package]
version       = "0.1.0"
stage         = "Q4/Q6"         # active pass: B1/B2/B3 queue-instruction path
schema_version = "2"

# --------------------------------------------------------------------- toolchain ---
[toolchain]
# Mirrors rust-toolchain.toml. The contained rustup in .tools/ installs this channel.
rust = "1.85.0"
# Minimum host Python for tools/g6q.py.
python_min = "3.9"

# ------------------------------------------------------------------ emission host ---
# QEMU is a SEPARATE WORK. It is fetched on demand into the gitignored ./qemu tree and
# receives generated GPL-2.0 C. Nothing in crates/** links or includes it
# (AGENTS-licensing.md §2).
[qemu]
url      = "https://gitlab.com/qemu-project/qemu.git"
ref      = "v10.0.0"           # emission target; bump deliberately
plugin_api = 4                  # QEMU TCG plugin API version assumed by emitted plugins
status   = "fetched"            # updated by `g6q fetch-qemu`; path is gitignored ./qemu
# Known limitation of this pin, measured not assumed (see architecture/EMIT.md §4):
# qemu_plugin_get_registers() is built from gdb_get_register_list(), which walks only the
# dynamically-registered gdbstub features (cpu->gdb_regs). A target's CORE register file
# (the RISC-V GPRs, described by gdb_core_xml_file) is never in that list, so a plugin
# cannot read xN. The B2 queue-instruction submission path is therefore inoperable on this
# pin and warns once; B1's in-target device and B3 implement that path instead. Re-test
# when this pin is bumped: if the core registers become visible, the B2 path works unchanged.
plugin_exposes_core_regs = false

# ---------------------------------------------------------------------- firmware ---
[opensbi]
url      = "https://github.com/riscv-software-src/opensbi.git"
ref      = "v1.5"               # >= 1.4 required
platform = "generic"            # no vendor platform C
fw_text_start = "0x80000000"
status   = "fetched"            # updated by `g6q fetch-fw`; path is gitignored out/fw-src/opensbi

# --------------------------------------------------------------- loader firmware ---
# U-Boot and EDK2 are SEPARATE GPL / BSD works. g6lc_qemu fetches them on demand into
# gitignored out/loader-src/ and emits board packages as text; no crate links them.
[u_boot]
url      = "https://github.com/u-boot/u-boot.git"
ref      = "v2025.07"           # U0 build-only pin; revalidate when board package matures
status   = "built"              # U3-SPI Linux FIT from NOR; U3-Shell virt bootefi Shell.efi (soc SPI StartImage residual)
defconfig_base = "qemu-riscv64_smode_defconfig"
text_base_offset = "0x200000"   # DRAM base + 2 MiB for S-mode text

[edk2]
url      = "https://github.com/tianocore/edk2.git"
ref      = "edk2-stable202511"  # E0 build-only pin; revalidate when RISC-V platform matures
fork     = "https://github.com/etcimon/edk2.git"
patches  = "g6lc_qemu/patches"
status   = "built"              # E2 Shell + E3 OpenWrt EFI stub on QEMU virt; FDs in out/loader-run/src/

[edk2_platforms]
url      = "https://github.com/tianocore/edk2-platforms.git"
ref      = "master"             # E0 build-only pin; use a commit SHA once the platform matures
status   = "planned"            # updated by `g6q fw fetch --loader edk2`; path is gitignored out/loader-src/edk2-platforms

# OpenWrt is a SEPARATE GPL work. Compile uses the *official* clone + patches.
# github.com/etcimon/openwrt (and openwrt-* feeds) are linux-dist development
# forks only; extract-patches.sh pulls diffs into g6lc_qemu/openwrt/patches.
# QEMU / testharness never build those forks.
[openwrt]
url      = "https://github.com/openwrt/openwrt.git"
ref      = "v24.10.2"
fork     = "https://github.com/etcimon/openwrt.git"
patches  = "g6lc_qemu/openwrt/patches"
status   = "built"              # ovh_calltorch 2026-09-01; initramfs-kernel.bin ready
target   = "sifiveu/generic"
device   = "sifive_unleashed"
overlay  = "g6lc_qemu/openwrt/patches/0002-sifiveu-g6lc-virt-and-isa-overlay.patch"

[openwrt_packages]
url      = "https://github.com/openwrt/packages.git"
ref      = "c7d1a8c1ae976bd0ad94a351d82ee8fbf16a81f0"
fork     = "https://github.com/etcimon/openwrt-packages.git"
path     = "g6lc_qemu/linux-dist/openwrt-packages"

[openwrt_luci]
url      = "https://github.com/openwrt/luci.git"
ref      = "d6b13f648339273facc07b173546ace459c1cabe"
fork     = "https://github.com/etcimon/openwrt-luci.git"
path     = "g6lc_qemu/linux-dist/openwrt-luci"

[openwrt_routing]
url      = "https://github.com/openwrt/routing.git"
ref      = "85d040f28c21c116c905aa15a66255dde80336e7"
fork     = "https://github.com/etcimon/openwrt-routing.git"
path     = "g6lc_qemu/linux-dist/openwrt-routing"

[openwrt_telephony]
url      = "https://github.com/openwrt/telephony.git"
ref      = "2a4541d46199ac96fac214d02c908402831c4dc6"
fork     = "https://github.com/etcimon/openwrt-telephony.git"
path     = "g6lc_qemu/linux-dist/openwrt-telephony"

# Ubuntu RISC-V slot (scaffold). Same ISA fragment as OpenWrt; no compile pin yet.
[ubuntu]
series   = "noble"
version  = "24.04"
arch     = "riscv64"
status   = "scaffolded"
path     = "g6lc_qemu/linux-dist/ubuntu"
isa      = "g6lc_qemu/linux-dist/isa"

# ----------------------------------------------------------------- riscv toolchain ---
[riscv_toolchain]
name     = "xpack-riscv-none-elf-gcc"
url      = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack"
ref      = "14.2.0-3"           # xPack release version; bump deliberately
prefix   = "riscv-none-elf-"    # CROSS_COMPILE prefix of the installed toolchain
status   = "not-fetched"

# ------------------------------------------------------- contracts consumed by pin ---
# Each entry names a document (in the host design, or upstream) whose content this
# package models. `rev` is the revision the current implementation was written against.
# A mismatch is a review item, not an automatic failure — but it must be looked at.

[contracts.trace_record]
name = "RVFI-shaped commit record (st_rvfi)"
kind = "host-design"
path = "verif/core-v-verif/.../riscv_dpi.cc + corev_apu/tb/common/spike.sv"
rev  = "unpinned"               # set when D1 lands (Q3/Q5)

[contracts.soc_map]
name = "SoC peripheral map"
kind = "host-design"
path = "corev_apu/tb/ariane_soc_pkg.sv"
rev  = "read-at-runtime"        # ingested, not transcribed

[contracts.core_config]
name = "Core configuration struct + legality rules"
kind = "host-design"
path = "core/include/config_pkg.sv (cva6_cfg_t, check_cfg)"
rev  = "read-at-runtime"

[contracts.pmu_events]
name = "PMU event matrix {group[7:5], idx[4:0]}"
kind = "host-design"
path = "core/perf_counters.sv + core/include/ariane_pkg.sv"
rev  = "read-at-runtime"

[contracts.ai_isa]
name = "Accelerator ISA / CSR / 64-byte descriptor contract"
kind = "host-design"
path = "core/cvxif_g6lc_ai/include/g6lc_ai_instr_pkg.sv"
rev  = "read-at-runtime"        # ingested as AiInstrSet; the 64-byte descriptor geometry is in ai_island_mmio

[contracts.ai_island_mmio]
name = "Accelerator island MMIO / CTL / completion / IRQ"
kind = "host-design"
path = "corev_apu/ai_island/include/g6lc_ai_desc_pkg.sv"
rev  = "read-at-runtime"        # ingested as AiDescLayout and AiRegMap

[contracts.ai_island_cap]
name = "Accelerator island capability window (clusters, MACs/cycle, AccTile, NoC, DRAM, queues, QoS)"
kind = "host-design"
path = "corev_apu/include/g6lc_ai_island_cfg_pkg.sv"
rev  = "read-at-runtime"        # ingested into TargetModel.soc.ai_island.config

[contracts.ai_host_transport]
name = "Host<->card transport for pushed accelerator work (BAR/virtio/doorbell roles)"
kind = "host-design"
path = "architecture/uncore/pcie-endpoint.md"
rev  = "unpinned"               # NOT modelled yet; see architecture/AI_BRIDGE.md §6

[contracts.dts_validation]
name = "Device-tree node/property cross-validation rows"
kind = "host-design"
path = "AGENTS-dts-validation.md §3"
rev  = "unpinned"               # set when --dts-validate lands (Q1)

# ------------------------------------------------------------------- dependencies ---
# Deliberately empty. The Rust workspace declares NO external crates so that
# `cargo test --workspace` runs offline (AGENTS.md §3). Adding one requires a recorded
# decision in AGENTS-todo.md (G4), an exact version below, a permissive licence, and a
# note on offline behaviour. Never a floating range. Never GPL/LGPL.
[dependencies]
