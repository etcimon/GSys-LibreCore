#
# The capability table: what to look for, in each of the three inputs, for every
# capability the model reports on.
#
# This is DATA, not code. It lives in a file rather than in the crate because the
# mapping is design-specific -- field names, source-path fragments and device-tree
# tokens all belong to a particular design, and burning them into the emulator would
# make the package usable against exactly one tree. Override with `--capabilities FILE`
# to point the tool at a fork or a differently-shaped design.
#
# Format
#   [name]            capability name as it appears in the report
#   config = Field    configuration field; `Outer.Inner` reads a nested struct
#   impl   = a; b     path fragments proving the implementing RTL is compiled
#   stub   = c; d     path fragments indicating a placeholder is compiled instead
#   dts    = t1, t2   device-tree extension tokens that advertise it
#   node   = name     device-tree node base name that advertises it
#   qemu   = p1, p2   stock-QEMU `-cpu` properties; defaults to the `dts` tokens,
#                     `-` means the stock model cannot express this capability
#                     (which is exactly what the B0 capability delta reports)
#
# CAVEAT on `qemu` values: property names belong to a QEMU release, and they have NOT
# been validated against a running binary -- no emulator was available where this table
# was written. Most map identically to the device-tree token, which is why that is the
# default. Validate against `qemu-system-riscv64 -cpu help` before trusting a boot, and
# pin the release in ../../../pins.toml. A wrong name here surfaces as an emulator
# start-up error, not as a silent misconfiguration, which is the failure mode to prefer.
#
# With no `impl`, the capability is INTRINSIC: it has no separate compilation unit and
# is present whenever the configuration enables it. Most extensions are intrinsic --
# they live in the decoder and the CSR file, which are always compiled.

# --- base ISA -----------------------------------------------------------------
[compressed]
config = RVC
dts    = c

[atomics]
config = RVA
dts    = a

[float-single]
config = RVF
dts    = f

[float-double]
config = RVD
dts    = d

# --- extensions ---------------------------------------------------------------
[bitmanip]
config = RVB
dts    = b, zba, zbb, zbs
qemu   = zba, zbb, zbs

[crypto]
config = ZKN
dts    = zkn

[cas-atomics]
config = RVZacas
dts    = zacas

[conditional-ops]
config = RVZiCond
dts    = zicond

# --- Zc code-size extensions (subsets of the compressed Zc extension) -----------------
[zcb]
config = RVZCB
dts    = zcb

[zcmp]
config = RVZCMP
dts    = zcmp

[zcmt]
config = RVZCMT
dts    = zcmt

[cache-maintenance]
config = RVZiCbom
dts    = zicbom

[cache-zero]
config = RVZiCboz
dts    = zicboz

[cache-prefetch]
config = RVZiCbop
dts    = zicbop

[base-counters]
config = RVZicntr
dts    = zicntr

[hpm-counters]
config = RVZihpm
impl   = perf_counters
dts    = zihpm

[supervisor-timer]
config = SstcEn
dts    = sstc

[counter-overflow]
config = SscofpmfEn
dts    = sscofpmf

[page-memory-types]
config = SvpbmtEn
dts    = svpbmt

[wait-on-reservation]
config = ZawrsEn
dts    = zawrs

[pause-hint]
config = ZihintpauseEn
dts    = zihintpause

[napot-pages]
config = SvnapotEn
dts    = svnapot

# Privilege modes are conveyed by the ISA string, not by a fine-grained extension
# token, so the device tree has no opinion to compare against. Giving these a `dts`
# entry produced a false `undeclared` verdict on every target.
[supervisor]
config = RVS

[user-mode]
config = RVU

[hypervisor]
config = RVH
dts    = h

# --- units with their own compilation ------------------------------------------
# The vector unit is vendored separately: its manifest can be absent while the
# configuration bit is on, in which case the elaborated design compiles a stub.
[vector]
config = RVV
impl   = vendor/ara/, /ara/
stub   = accel_first_pass_decoder_stub
dts    = v, zve64d
qemu   = v

# The matrix accelerator has a core-attached instruction plane (the `Xg6lcai` ISA
# token) and an uncore island (an `ai-island` device node). They are reported as two
# separate rows so a config that enables the instructions without the island, or an
# island without the instructions, is visible rather than silently conflated.
[matrix-accelerator]
config = AiCfg.MatrixEn
impl   = cvxif_g6lc_ai/
dts    = xg6lcai
qemu   = -

[ai-island]
config = AiCfg.MatrixEn
impl   = g6lc_ai_island
node   = ai-matrix
qemu   = -

[coprocessor-interface]
config = CvxifEn
impl   = cvxif
qemu   = -

# --- memory hierarchy ------------------------------------------------------------
[second-level-cache]
config = L2En
impl   = l2_cache/

[third-level-cache]
config = L3En
impl   = l3_cache/

[hardware-prefetch]
config = HwPrefetchEn

[way-prediction]
config = WayPredEn
impl   = way_predictor

# --- speculation ------------------------------------------------------------------
[slice-out-of-order]
config = SliceOoOEn
impl   = slice_

[full-out-of-order]
config = OoOEn
impl   = /ooo/

[deep-speculation]
config = DeepSpecEn

# --- threading --------------------------------------------------------------------
[debug]
config = DebugEn
impl   = debug

[mmu]
config = MmuPresent
impl   = mmu

[pmp]
config = NrPMPEntries
impl   = core/pmp/
