#
# GitLab mirror of the fast GitHub gate (.github/workflows/ci.yml), for
# https://gitlab.com/etcimon/GSys-LibreCore on gitlab.com shared runners.
#
# Same lanes, same entry points (each package's own green gate through
# ./build.sh), same provisioning rules: no recursive submodule checkout, the
# pinned+patched Verilator built by `tools install verilator` and cached,
# Rust lanes with debuginfo/incremental off and source mtimes restored so a
# cached target/ is reusable. Lane table: AGENTS-build.md § Continuous integration.
#
# The upstream OpenHW/Thales pipeline that used to live here needs a private
# `$CI_PROJECT_NAMESPACE/setup-ci` include project and Thales runners with
# VCS/Questa/Vivado; on gitlab.com it failed at configuration before creating a
# single job. It is preserved verbatim at .gitlab-ci/openhw-thales-pipeline.yml
# (with .gitlab-ci/README.md and .gitlab-ci/scripts) for a mirror that has that
# infrastructure.
#
# Shared runners are 2 vCPU: budget ~10 min per Rust lane cold, ~25 min for the
# first Verilator build (cached afterwards). Pipelines run for the default
# branch, merge requests, the web UI and schedules; a newer push cancels the
# older pipeline (interruptible).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  GIT_DEPTH: "1"
  # Each lane inits exactly the submodules it needs (GIT_SUBMODULE_PATHS).
  GIT_SUBMODULE_STRATEGY: none
  GIT_SUBMODULE_DEPTH: "1"
  NO_COLOR: "1"
  # Never wait on the interactive "install missing managed tools?" prompt.
  G6LC_NO_TOOL_PROMPT: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  DEBIAN_FRONTEND: noninteractive

default:
  interruptible: true
  timeout: 1h

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

# The bootstrap wrapper installs Bun itself (curl | bash) when it is missing;
# that needs curl + unzip. PATH is exported for the rest of the job.
.bun-bootstrap: &bun-bootstrap
  - export BUN_INSTALL="$HOME/.bun" PATH="$HOME/.bun/bin:$PATH"
  - command -v bun >/dev/null 2>&1 || curl -fsSL https://bun.sh/install | bash >/dev/null
  - bun --version

# Rust lanes: the official image carries rustup/cargo/rustfmt/clippy for the
# pinned 1.85 toolchain (the packages' rust-toolchain.toml agree). The KD0
# workspaces have no crates.io dependencies, so a cached target/ only pays off
# when unchanged crates keep their fingerprints -- hence full history
# (GIT_DEPTH 0) and git-restore-mtime.
.rust-lane:
  image: rust:1.85-bookworm
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 python3-venv python3-pip unzip git-restore-mtime > /dev/null
    - git restore-mtime
    - *bun-bootstrap
    - rustc --version && cargo --version

# ---------------------------------------------------------------------------
platform:
  image: oven/bun:1
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git python3 ca-certificates > /dev/null
  script:
    - cd build-platform
    # devDependencies only (type packages); the runtime has zero dependencies.
    - bun install
    - bunx tsc --noEmit
    - bun test
    - cd ..
    # The bootstrap wrapper and the offline CLI surface (no network, no EDA tools).
    - ./build.sh config
    - ./build.sh status
    - ./build.sh test --list
    - ./build.sh test --open-source --dry-run
    - ./build.sh diag list
    - ./build.sh diag run host
    - ./build.sh timings doctor
    - ./build.sh timings lab-run
    - |
      lab=build-platform/workspace/build/sta-handoff/lab-run
      for f in lab-report.md lab-report.json seeds.sdc opensta/paths.rpt correlate.json retune-proposal.md retune-proposal.json; do
        test -f "$lab/$f" || { echo "missing $lab/$f"; exit 1; }
      done
      grep -Eq '"overlap_score"[[:space:]]*:[[:space:]]*[0-9]' "$lab/correlate.json"
      grep -q 'cva6-fo4-retune-proposal' "$lab/retune-proposal.json"
      head -n 40 "$lab/lab-report.md"

# ---------------------------------------------------------------------------
rtl-lint:
  image: ubuntu:24.04
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: core/cvfpu core/cache_subsystem/hpdcache
    # Deps are installed below; the recipe must not try apt itself.
    VERILATOR_SKIP_DEPS: "1"
  # The managed prefix the build platform expects. The key covers the recipe
  # and the custom patches, so editing a fix rebuilds the tool.
  cache:
    key:
      files:
        - build-platform/scripts/install-verilator.sh
        - verif/regress/verilator-v5.patch
      prefix: verilator-v5.008
    paths:
      - build-platform/workspace/tooling/verilator-v5.008
    policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates curl unzip python3 perl make g++ autoconf bison flex help2man libfl-dev libfl2 zlib1g-dev > /dev/null
    - *bun-bootstrap
  script:
    # One recipe, shared with every host: clones the pinned tag, applies every
    # verif/regress/verilator-*.patch strictly, skips Verilator's own `make
    # test`, verifies the installed headers carry each patched line. On a
    # cache hit it re-verifies and reports "already installed (patched ...)".
    - ./build.sh tools install verilator
    - |
      prefix="$PWD/build-platform/workspace/tooling/verilator-v5.008"
      "$prefix/bin/verilator_bin" --version
      "$prefix/bin/verilator_bin" --version | grep -q '(mod)'
      grep -q 'WData\* data() { return (WData\*)&m_storage\[0\]; }' "$prefix/share/verilator/include/verilated_types.h"
    - |
      cat > build-platform/.config.local.ts <<'EOF'
      // CI overlay: lint/elab tools come from the managed pinned Verilator prefix.
      export default { verify: { suite: { root: "verilator-v5.008", version: "v5.008" } } };
      EOF
    - ./build.sh diag status
    # core = ISA red lines + firmware-accommodation scan + cv64a6_imafdc_sv39 /
    # cv32a65x lint + formal-package presence; the ids add the LibreCore packages.
    - >
      ./build.sh diag run core
      diag-smt2-lint diag-smt2-comb-loops
      diag-ooo-int-lint diag-smt2-ooo-int-lint diag-ooo-int2-lint diag-ooo-int2-l3-lint diag-smt2-l3-lint
      diag-ai-lint
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build-platform/workspace/build/diagnostics

# ---------------------------------------------------------------------------
sv-timing:
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: sv-timing/crates/sv-parser
  # `svt.py` only ever drives its contained toolchain under sv-timing/.tools.
  cache:
    - key:
        files:
          - sv-timing/rust-toolchain.toml
          - sv-timing/requirements.txt
        prefix: svt-tools
      paths:
        - sv-timing/.tools
    - key:
        files:
          - sv-timing/Cargo.lock
        prefix: svt-target
      paths:
        - sv-timing/target
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates curl unzip python3 python3-venv python3-pip build-essential > /dev/null
    - *bun-bootstrap
  script:
    - cd sv-timing
    - python3 tools/svt.py setup
    - python3 tools/svt.py doctor
    - python3 tools/svt.py test
    - cd ..
    # Host adapter: build-platform `timings compile` of the fixture project
    # through the package CLI, then the smoke assertions on the package.
    - ./build.sh test sv-timing-smoke
    # Known-red package hygiene (rustfmt drift, KD0 symbol strings in test
    # fixtures). Reported, not blocking, until fixed.
    - (cd sv-timing && python3 tools/svt.py check) || echo "svt check -- informational failure, see log above"

# ---------------------------------------------------------------------------
bios:
  extends: .rust-lane
  cache:
    key: bios-target-$CI_COMMIT_REF_SLUG
    paths:
      - g6lc_bios/target
    policy: pull-push
  script:
    # kernel-spec submodules + botan RFC 8448 vectors (g6b-tls build.rs).
    - cd g6lc_bios && python3 tools/g6b.py spec-sync && cd ..
    # Provisions the forked wasm-opt (g6b-kernel asyncify tests), then
    # independence, native/journal tests, fmt, clippy, cargo test, bios-regress.
    # The browser-ui bun lane needs the libwasm/svelte-d submodules and LDC;
    # the tracked browser-ui/out artifacts feed the cargo gates instead.
    - ./build.sh g6b check --rust-only

# ---------------------------------------------------------------------------
qemu:
  extends: .rust-lane
  cache:
    key: qemu-target-$CI_COMMIT_REF_SLUG
    paths:
      - g6lc_qemu/target
    policy: pull-push
  script:
    - ./build.sh g6q doctor
    - ./build.sh g6q check

# ---------------------------------------------------------------------------
ai-tensor:
  extends: .rust-lane
  cache:
    key: ai-tensor-target-$CI_COMMIT_REF_SLUG
    paths:
      - ai-tensor/target
    policy: pull-push
  script:
    - python3 -m pip install --quiet --break-system-packages pytest numpy
    - ./build.sh tensor doctor
    # cargo tests + golden-check + queue-soak via monorepo-soak/run-ai-tensor.sh
    - ./build.sh tensor test
    - cd ai-tensor && PYTHONPATH=python python3 -m pytest -q -p no:cacheprovider python/tests
